[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridwise-campus"
version = "0.1.0"
description = "Offline campus energy analysis and battery-grid dispatch optimization prototype"
authors = [
    { name = "安外尔 (Anwar)", email = "smartcampusenergy@outlook.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["campus-energy", "battery-dispatch", "optimization", "pyomo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pyomo==6.9.5", "highspy==1.15.1"]

[project.urls]
Homepage = "https://github.com/2257005148-jpg/GridWise-Campus"
Repository = "https://github.com/2257005148-jpg/GridWise-Campus.git"
Issues = "https://github.com/2257005148-jpg/GridWise-Campus/issues"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
gridwise = "gridwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "unit: isolated in-process logic without Tk, subprocess, real solver, or independent auditor",
    "gui: Tk/Tcl widget, window, event-loop, or desktop-state behavior",
    "integration: filesystem, subprocess, persistence, publication, or cross-module behavior",
    "solver: may invoke the real Pyomo SolverFactory or a real solver subprocess",
    "audit: may start or validate an independent export/history audit workflow",
    "slow: intentionally repeated, multi-process, timeout, or long-running behavior",
]
