name: Feature request
description: Suggest an improvement or new capability for GridWise Campus.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe the problem or use case before proposing a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what limitation are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered a workaround or another approach?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add diagrams or synthetic examples if they help explain the request. Do not include secrets or real campus data.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I have not included credentials or sensitive data.
          required: true
