name: Bug report
description: Report a reproducible problem in GridWise Campus.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve GridWise. Please search existing issues first.
        Do not include passwords, API keys, private keys, real campus data, or other sensitive information.
  - type: input
    id: version
    attributes:
      label: GridWise version or commit
      description: For example, the release version or Git commit SHA.
      placeholder: "v0.x.x or commit SHA"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, version/build"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.12.x"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence. Use synthetic data.
      placeholder: |
        1. Start GridWise...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal paths, identifiers, credentials, and real-world data before attaching.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive or personal data.
          required: true
        - label: I used synthetic data where applicable.
          required: true
