name: Synthetic validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record execution environment
        run: python -c "import platform, sys; print(platform.platform()); print(sys.version)"
      - name: Install observed Windows dependency versions
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[test]" -c requirements/verified-win-py312.txt
      - name: Install declared dependencies on other platforms
        if: runner.os != 'Windows'
        run: python -m pip install -e ".[test]"
      - name: Run all tests
        run: python -m pytest -ra -q
      - name: Generate synthetic exports
        run: python -m gridwise.cli examples/synthetic-day.json outputs/ci
      - name: Audit synthetic exports
        run: python tools/audit_exports.py examples/synthetic-day.json outputs/ci/optimized.csv outputs/ci/baseline.csv outputs/ci/summary.json
